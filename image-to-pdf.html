<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuCraft - Image to PDF Converter</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1a18;
      --ink-2: #4a4a46;
      --ink-3: #8a8a84;
      --surface: #f7f6f2;
      --surface-2: #eeecea;
      --surface-3: #e4e2dd;
      --white: #ffffff;
      --accent: #2d5a3d;
      --accent-light: #e8f0ea;
      --accent-mid: #4a7c5c;
      --radius: 10px;
      --radius-lg: 16px;
      --transition: all 0.2s ease;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--surface);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--ink);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    header svg { color: #7ec898; flex-shrink: 0; }
    .header-text h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .nav-back {
      text-decoration: none;
      color: var(--surface-2);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }
    .nav-back:hover { color: #fff; }

    main {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px 60px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 32px;
    }

    @media (max-width: 850px) {
      main { grid-template-columns: 1fr; }
    }

    .workspace { display: flex; flex-direction: column; gap: 24px; }
    
    .panel-card {
      background: var(--white);
      border: 1px solid var(--surface-3);
      border-radius: var(--radius-lg);
      padding: 24px;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--ink-2);
      margin-bottom: 16px;
    }

    .dropzone {
      border: 2px dashed var(--surface-3);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      background: var(--white);
      transition: var(--transition);
    }
    .dropzone:hover { border-color: var(--accent-mid); background: var(--surface); }
    .dropzone svg { color: var(--ink-3); margin-bottom: 12px; }
    .dropzone p { font-size: 14px; color: var(--ink-2); margin-bottom: 4px; }
    .dropzone span { font-size: 12px; color: var(--ink-3); }
    .dropzone input { display: none; }

    .control-group { margin-bottom: 16px; }
    .control-group:last-child { margin-bottom: 0; }
    .control-label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
    
    .select-input, .text-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--surface-3);
      border-radius: var(--radius);
      background: var(--surface);
      font-family: inherit;
      font-size: 13px;
      color: var(--ink);
      outline: none;
      transition: var(--transition);
    }
    .select-input:focus, .text-input:focus { border-color: var(--ink-2); background: var(--white); }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary { background: var(--ink); color: var(--white); }
    .btn-primary:hover:not(:disabled) { background: #333330; }
    .btn-secondary { background: var(--surface-2); color: var(--ink); margin-top: 10px; }
    .btn-secondary:hover:not(:disabled) { background: var(--surface-3); }
    .btn:disabled { background: var(--surface-2); color: var(--ink-3); cursor: not-allowed; border: 1px solid var(--surface-3); }

    .queue-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .queue-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--surface-3);
      border-radius: var(--radius);
      padding: 8px 12px;
    }
    .queue-thumb { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; background: var(--surface-2); border: 1px solid var(--surface-3); }
    .queue-info { flex: 1; min-width: 0; }
    .queue-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .queue-meta { font-size: 11px; color: var(--ink-3); }
    .queue-actions { display: flex; gap: 4px; }
    .action-btn { background: none; border: none; padding: 6px; cursor: pointer; color: var(--ink-2); border-radius: 4px; }
    .action-btn:hover { background: var(--surface-2); color: var(--ink); }

    .progress-container { display: none; margin-top: 16px; }
    .progress-bar-bg { width: 100%; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
    .progress-bar-fill { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s linear; }
    .progress-text { font-size: 11px; color: var(--ink-3); text-align: right; margin-top: 4px; }

    .status-msg { font-size: 13px; text-align: center; margin-top: 12px; display: none; padding: 8px; border-radius: var(--radius); }
    .success-text { display: block; background: var(--accent-light); color: var(--accent); font-weight: 500; }
    .error-text { display: block; background: #fce8e6; color: #a33b3b; font-weight: 500; }

    footer { text-align: center; padding: 20px 24px; font-size: 12px; color: var(--ink-3); border-top: 1px solid var(--surface-3); background: var(--white); margin-top: auto; }
    footer .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); display: inline-block; margin: 0 6px; vertical-align: middle; }
  </style>
</head>
<body>

<header>
  <a href="./" class="header-logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
      <line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/>
    </svg>
    <div class="header-text"><h1>DocuCraft</h1></div>
  </a>
  <a href="./" class="nav-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Back to hub
  </a>
</header>

<main>
  <div class="workspace">
    <div class="panel-card">
      <div class="panel-title">Asset Deployment Queue</div>
      <div class="dropzone" id="dropzone">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        <p>Drag and drop images or click to safely browse</p>
        <span>Supports PNG, JPG, JPEG, and WebP layers</span>
        <input type="file" id="fileInput" multiple accept="image/png, image/jpeg, image/jpg, image/webp" />
      </div>
      <div class="queue-list" id="queueList"></div>
    </div>
  </div>

  <div class="sidebar">
    <div class="panel-card">
      <div class="panel-title">Compilation Panel</div>
      
      <div class="control-group">
        <label class="control-label">Layout Architecture</label>
        <select class="select-input" id="pageSize">
          <option value="a4">A4 (Standard Document Matrix)</option>
          <option value="letter">US Letter Geometric Layout</option>
          <option value="fit">Adaptive Aspect Boundaries (Fit Image)</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label">Orientation Matrix</label>
        <select class="select-input" id="pageOrientation">
          <option value="portrait">Vertical Blueprint (Portrait)</option>
          <option value="landscape">Horizontal Projection (Landscape)</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label">Margin Strategy</label>
        <select class="select-input" id="pageMargins">
          <option value="none">Zero Edge Tolerances (Full Bleed)</option>
          <option value="small">Compressed Boundaries (5mm Margin)</option>
          <option value="large">Standard Workspace Perimeter (12mm Margin)</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label">Metadata: Document Title</label>
        <input type="text" class="text-input" id="metaTitle" placeholder="Untitled Record Matrix" />
      </div>

      <div class="control-group">
        <label class="control-label">Metadata: System Author</label>
        <input type="text" class="text-input" id="metaAuthor" placeholder="DocuCraft Client Module" />
      </div>

      <div style="margin-top: 24px;">
        <button class="btn btn-primary" id="convertBtn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Compile PDF Document
        </button>
        <button class="btn btn-secondary" id="splitBtn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          Export Isolated Sequences (ZIP)
        </button>
      </div>

      <div class="progress-container" id="progressContainer">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
        <div class="progress-text" id="progressText">0% Complete</div>
      </div>

      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>
</main>

<footer>
  <span class="dot"></span>No sign up required, Free forever<span class="dot"></span>
</footer>

<script>
  let queue = [];

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const queueList = document.getElementById('queueList');
  const convertBtn = document.getElementById('convertBtn');
  const splitBtn = document.getElementById('splitBtn');
  const progressContainer = document.getElementById('progressContainer');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const statusMsg = document.getElementById('statusMsg');

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = 'var(--accent-mid)'; });
  dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = 'var(--surface-3)'; });
  dropzone.addEventListener('drop', (e) => { e.preventDefault(); dropzone.style.borderColor = 'var(--surface-3)'; handleFiles(e.dataTransfer.files); });
  fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

  function handleFiles(files) {
    for (const file of files) {
      if (!file.type.startsWith('image/')) continue;
      const id = crypto.randomUUID();
      const item = { id, file, active: true, thumbUrl: URL.createObjectURL(file) };
      queue.push(item);
    }
    updateUI();
  }

  function updateUI() {
    queueList.innerHTML = '';
    queue.forEach((item, index) => {
      const el = document.createElement('div');
      el.className = 'queue-item';
      if (!item.active) el.style.opacity = '0.5';
      el.innerHTML = `
        <img class="queue-thumb" src="${item.thumbUrl}" />
        <div class="queue-info">
          <div class="queue-name">${item.file.name}</div>
          <div class="queue-meta">${(item.file.size/1024).toFixed(1)} KB</div>
        </div>
        <div class="queue-actions">
          <button class="action-btn" onclick="moveItem(${index}, -1)">↑</button>
          <button class="action-btn" onclick="moveItem(${index}, 1)">↓</button>
          <button class="action-btn" onclick="removeItem('${item.id}')">✕</button>
        </div>
      `;
      queueList.appendChild(el);
    });

    const activeCount = queue.filter(i => i.active).length;
    convertBtn.disabled = activeCount === 0;
    splitBtn.disabled = activeCount === 0;
  }

  window.moveItem = (index, dir) => {
    const target = index + dir;
    if (target < 0 || target >= queue.length) return;
    const tmp = queue[index];
    queue[index] = queue[target];
    queue[target] = tmp;
    updateUI();
  };

  window.removeItem = (id) => {
    const idx = queue.findIndex(i => i.id === id);
    if (idx !== -1) {
      URL.revokeObjectURL(queue[idx].thumbUrl);
      queue.splice(idx, 1);
    }
    updateUI();
  };

  function setProgress(val, hide = false) {
    progressContainer.style.display = hide ? 'none' : 'block';
    progressBar.style.width = `${val}%`;
    progressText.textContent = `${val}% Complete`;
  }

  // Compiler Engines logic remains fully localized and operational
  convertBtn.addEventListener('click', async () => {
    const activeItems = queue.filter(i => i.active);
    if (!activeItems.length) return;

    splitBtn.disabled = true;
    convertBtn.disabled = true;
    statusMsg.style.display = 'none';
    setProgress(5);

    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: document.getElementById('pageOrientation').value, unit: 'mm', format: document.getElementById('pageSize').value === 'fit' ? 'a4' : document.getElementById('pageSize').value });
      
      const pSize = document.getElementById('pageSize').value;
      const pStrat = document.getElementById('pageMargins').value;
      const margin = pStrat === 'none' ? 0 : (pStrat === 'small' ? 5 : 12);

      for (let i = 0; i < activeItems.length; i++) {
        if (i > 0) pdf.addPage();
        const item = activeItems[i];
        
        await new Promise((resolve) => {
          const img = new Image();
          img.src = item.thumbUrl;
          img.onload = () => {
            let pW = pdf.internal.pageSize.getWidth();
            let pH = pdf.internal.pageSize.getHeight();
            
            if (pSize === 'fit') {
              pdf.setPage(i + 1);
              pdf.internal.pageSize.setWidth(img.width * 0.264583);
              pdf.internal.pageSize.setHeight(img.height * 0.264583);
              pW = pdf.internal.pageSize.getWidth();
              pH = pdf.internal.pageSize.getHeight();
            }

            const availW = pW - (margin * 2);
            const availH = pH - (margin * 2);
            let dW = availW;
            let dH = (img.height * dW) / img.width;

            if (dH > availH) {
              dH = availH;
              dW = (img.width * dH) / img.height;
            }

            const x = margin + (availW - dW) / 2;
            const y = margin + (availH - dH) / 2;

            pdf.addImage(img, 'JPEG', x, y, dW, dH);
            resolve();
          };
        });
        setProgress(5 + Math.round((i / activeItems.length) * 85));
      }

      const title = document.getElementById('metaTitle').value.trim();
      const author = document.getElementById('metaAuthor').value.trim();
      if (title || author) pdf.setProperties({ title: title || undefined, author: author || undefined });

      setProgress(95);
      pdf.save('docucraft-compiled.pdf');
      setProgress(100);

      statusMsg.textContent = '✓ PDF document layout compiled successfully.';
      statusMsg.className = 'status-msg success-text';
    } catch (err) {
      console.error(err);
      statusMsg.textContent = '⚠ Execution pipeline encountered data errors.';
      statusMsg.className = 'status-msg error-text';
    }
    splitBtn.disabled = false;
    convertBtn.disabled = false;
    setTimeout(() => setProgress(0, true), 1200);
  });

  splitBtn.addEventListener('click', async () => {
    const activeItems = queue.filter(i => i.active);
    if (!activeItems.length) return;

    splitBtn.disabled = true;
    convertBtn.disabled = true;
    statusMsg.style.display = 'none';
    setProgress(5);

    try {
      const zip = new JSZip();
      const { jsPDF } = window.jspdf;

      for (let i = 0; i < activeItems.length; i++) {
        const item = activeItems[i];
        const pdf = new jsPDF({ orientation: document.getElementById('pageOrientation').value, unit: 'mm', format: document.getElementById('pageSize').value === 'fit' ? 'a4' : document.getElementById('pageSize').value });
        
        await new Promise((resolve) => {
          const img = new Image();
          img.src = item.thumbUrl;
          img.onload = () => {
            let pW = pdf.internal.pageSize.getWidth();
            let pH = pdf.internal.pageSize.getHeight();
            if (document.getElementById('pageSize').value === 'fit') {
              pdf.internal.pageSize.setWidth(img.width * 0.264583);
              pdf.internal.pageSize.setHeight(img.height * 0.264583);
              pW = pdf.internal.pageSize.getWidth();
              pH = pdf.internal.pageSize.getHeight();
            }
            const pStrat = document.getElementById('pageMargins').value;
            const margin = pStrat === 'none' ? 0 : (pStrat === 'small' ? 5 : 12);
            const availW = pW - (margin * 2);
            const availH = pH - (margin * 2);
            let dW = availW; let dH = (img.height * dW) / img.width;
            if (dH > availH) { dH = availH; dW = (img.width * dH) / img.height; }
            pdf.addImage(img, 'JPEG', margin + (availW - dW)/2, margin + (availH - dH)/2, dW, dH);
            resolve();
          };
        });

        const title = document.getElementById('metaTitle').value.trim();
        const author = document.getElementById('metaAuthor').value.trim();
        if (title || author) pdf.setProperties({ title: title || undefined, author: author || undefined });

        const base = item.file.name.replace(/\.[^/.]+$/, '');
        const fname = `${String(i + 1).padStart(3, '0')}_${base}.pdf`;
        zip.file(fname, pdf.output('blob'));
        setProgress(5 + Math.round((i / activeItems.length) * 85));
      }

      setProgress(95);
      const blob = await zip.generateAsync({ type: 'blob' });
      setProgress(100);

      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'images-split.zip';
      a.click();
      URL.revokeObjectURL(a.href);

      statusMsg.textContent = `✓ images-split.zip downloaded (${activeItems.length} PDFs)`;
      statusMsg.className = 'status-msg success-text';
    } catch (err) {
      console.error(err);
      statusMsg.textContent = '⚠ ZIP generation failed. Check console constraints.';
      statusMsg.className = 'status-msg error-text';
    }

    splitBtn.disabled = false;
    convertBtn.disabled = false;
    setTimeout(() => setProgress(0, true), 1200);
  });
</script>

</body>
</html>
