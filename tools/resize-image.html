<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DocuCraft - Image Resizer</title>
  <meta name="description" content="Resize PNG, JPG, and WebP images by pixels or percentage in your browser. Batch resizing, free, private, no upload required." />
  <meta name="theme-color" content="#2d5a3d" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />

  <meta property="og:url" content="https://www.docucraft.site/tools/resize-image.html" />

  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="DocuCraft — free, private PDF &amp; image tools" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Image Resizer — DocuCraft" />
  <meta name="twitter:description" content="Resize PNG, JPG, and WebP images by pixels or percentage in your browser. Batch resizing, free, private, no upload required." />
  <meta name="twitter:image" content="https://www.docucraft.site/og-image.png" />
  <link rel="icon" type="image/svg+xml" href="../icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #1a1a18; --ink-2: #4a4a46; --ink-3: #8a8a84;
      --surface: #f7f6f2; --surface-2: #eeecea; --surface-3: #e4e2dd;
      --white: #ffffff; --radius: 10px; --radius-lg: 16px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --accent: #2d5a3d; --accent-light: #e8f0ea; --accent-mid: #4a7c5c;
      --header-bg: rgba(255,255,255,0.35); --header-text: #1a1a18;
      --header-hover: #2d5a3d; --header-icon-color: #4a4a46;
      --header-border: rgba(255,255,255,0.4);
      --header-shadow: 0 4px 30px rgba(0,0,0,0.05);
      --header-highlight: rgba(255,255,255,0.9);
    }
    html[data-theme="dark"] {
      --ink: #f7f6f2; --ink-2: #c4c2be; --ink-3: #8a8a84;
      --surface: #121211; --surface-2: #1c1c1a; --surface-3: #2a2a27; --white: #1a1a18;
      --header-bg: rgba(20,20,18,0.45); --header-text: #f7f6f2; --header-hover: #7ec898;
      --header-icon-color: #8a8a84; --header-border: rgba(255,255,255,0.08);
      --header-shadow: 0 4px 30px rgba(0,0,0,0.3); --header-highlight: rgba(255,255,255,0.06);
    }
    body { font-family: 'DM Sans', sans-serif; background-color: var(--surface); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; }
    header {
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent 40%), var(--header-bg);
      padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(30px) saturate(200%) brightness(1.1);
      -webkit-backdrop-filter: blur(30px) saturate(200%) brightness(1.1);
      box-shadow: var(--header-shadow), inset 0 1px 1px var(--header-highlight), inset 0 -1px 0 rgba(0,0,0,0.05);
      border-bottom: 1px solid var(--header-border);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .header-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    header svg { color: #7ec898; flex-shrink: 0; }
    .header-text h1 { font-family: 'Instrument Serif', serif; font-size: 24px; letter-spacing: -0.01em; display: flex; user-select: none; transition: transform 0.6s cubic-bezier(0.25,1,0.5,1); transform-origin: left center; }
    .header-logo:hover .header-text h1 { transform: scale(1.1); }
    .header-text h1 .logo-letter { color: var(--header-text); transition: color 0.8s ease-in-out; display: inline-block; }
    .header-actions { display: flex; align-items: center; gap: 16px; }
    .header-btn { background: none; border: none; color: var(--header-icon-color); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: var(--transition); }
    .header-btn:hover { color: var(--header-hover); transform: scale(1.05); }
    .header-btn svg { color: inherit; fill: none; stroke: currentColor; }
    html[data-theme="dark"] .theme-toggle .moon-path { display: none; }
    html:not([data-theme="dark"]) .theme-toggle .sun-path { display: none; }
    .nav-back { text-decoration: none; color: var(--header-icon-color); font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: var(--transition); }
    .nav-back:hover { color: var(--header-hover); transform: translateX(-2px); }
    main { flex: 1; max-width: 800px; width: 100%; margin: 0 auto; padding: 40px 24px 60px; }
    .hero { text-align: center; margin-bottom: 32px; }
    .hero h2 { font-family: 'Instrument Serif', serif; font-size: 42px; font-weight: 400; line-height: 1.1; margin-bottom: 8px; }
    .hero p { color: var(--ink-2); font-size: 15px; }
    .workspace-card { background: var(--white); border: 1px solid var(--surface-3); border-radius: var(--radius-lg); padding: 24px; }
    .dropzone { border: 2px dashed var(--surface-3); border-radius: var(--radius); padding: 40px 20px; text-align: center; cursor: pointer; transition: var(--transition); background: var(--white); }
    .dropzone:hover, .dropzone:focus { border-color: var(--accent-mid); background: var(--accent-light); outline: none; }
    .dropzone svg { color: var(--ink-3); margin-bottom: 12px; }
    .dropzone p { font-size: 14px; color: var(--ink-2); }
    .dropzone .sub { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
    .dropzone input { display: none; }
    .file-row { align-items: center; gap: 12px; padding: 12px; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--surface-3); margin-top: 20px; display: none; }
    .file-row svg { color: var(--ink-3); flex-shrink: 0; }
    .file-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-list { margin-top: 20px; display: none; flex-direction: column; gap: 8px; }
    .file-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--surface-3); border-radius: var(--radius); }
    .file-item svg { color: var(--ink-3); flex-shrink: 0; }
    .f-name { font-size: 13px; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .f-meta { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
    .f-status { font-size: 12px; font-weight: 600; white-space: nowrap; }
    .f-status.ok { color: var(--accent); }
    .f-status.err { color: #a33b3b; }
    .f-remove { background: none; border: none; color: var(--ink-3); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 50%; transition: var(--transition); flex-shrink: 0; }
    .f-remove:hover { color: #a33b3b; background: var(--surface-2); }
    .settings-section { margin-top: 20px; display: none; }
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 520px) { .settings-grid { grid-template-columns: 1fr; } }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; font-weight: 500; color: var(--ink-2); }
    .field select, .field input[type="number"], .field input[type="text"] { padding: 9px 12px; border: 1px solid var(--surface-3); border-radius: var(--radius); background: var(--surface); color: var(--ink); font-family: 'DM Sans', sans-serif; font-size: 14px; transition: var(--transition); }
    .field select:focus, .field input[type="number"]:focus, .field input[type="text"]:focus { outline: none; border-color: var(--accent-mid); }
    .field input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .field input[type="color"] { width: 100%; height: 38px; padding: 4px; border: 1px solid var(--surface-3); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
    .range-value { font-size: 12px; color: var(--ink-3); font-weight: 500; }
    .checkbox-field { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; user-select: none; }
    .checkbox-field input { accent-color: var(--accent); margin: 0; cursor: pointer; }
    .info-box { margin-top: 16px; padding: 12px 16px; background: var(--accent-light); border: 1px solid var(--accent-mid); border-radius: var(--radius); font-size: 13px; color: var(--accent); display: none; }
    .warn-box { margin-top: 16px; padding: 12px 16px; background: #fdf0ef; border: 1px solid #d9a09a; border-radius: var(--radius); font-size: 13px; color: #a33b3b; display: none; }
    html[data-theme="dark"] .warn-box { background: #2a1c1a; border-color: #6b3a35; color: #e09a93; }
    .progress-bar-wrap { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 20px; display: none; }
    .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; width: 0%; transition: width 0.3s ease; }
    .progress-label { font-size: 12px; color: var(--ink-3); margin-top: 8px; text-align: center; display: none; }
    .btn-action { width: 100%; margin-top: 20px; padding: 14px; background: var(--ink); color: var(--white); border: none; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 14px; cursor: pointer; transition: var(--transition); }
    .btn-action:hover:not(:disabled) { background: #333330; }
    .btn-action:disabled { background: var(--surface-2); color: var(--ink-3); cursor: not-allowed; border: 1px solid var(--surface-3); }
    .btn-secondary { background: var(--accent); }
    .btn-secondary:hover:not(:disabled) { background: var(--accent-mid); }
    .checker { background: conic-gradient(var(--surface-2) 90deg, transparent 90deg 180deg, var(--surface-2) 180deg 270deg, transparent 270deg) 0 0 / 16px 16px; }
    .status-msg { margin-top: 14px; font-size: 13px; text-align: center; }
    .status-success { color: var(--accent); font-weight: 500; }
    .status-error { color: #a33b3b; font-weight: 500; }
    footer { text-align: center; padding: 20px 24px; font-size: 12px; color: var(--ink-3); border-top: 1px solid var(--surface-3); background: var(--white); margin-top: auto; }
    footer .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); display: inline-block; margin: 0 6px; vertical-align: middle; }
  </style>
  <link rel="stylesheet" href="/app.css" />
  <script src="/app.js" defer></script>
</head>
<body>

  <header>
    <a href="../#images" class="header-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
        <line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/>
      </svg>
      <div class="header-text">
        <h1>
          <span class="logo-letter">D</span><span class="logo-letter">o</span><span class="logo-letter">c</span>
          <span class="logo-letter">u</span><span class="logo-letter">C</span><span class="logo-letter">r</span>
          <span class="logo-letter">a</span><span class="logo-letter">f</span><span class="logo-letter">t</span>
        </h1>
      </div>
    </a>
    <div class="header-actions">
      <button id="themeToggle" class="header-btn theme-toggle" aria-label="Toggle dark mode">
        <svg width="22" height="22" viewBox="0 0 24 24">
          <g class="moon-path"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></g>
          <g class="sun-path">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </g>
        </svg>
      </button>
      <a href="../#images" class="nav-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to hub
      </a>
    </div>
  </header>

  <main>
    <div class="hero">
      <h2>Image Resizer</h2>
      <p>Resize photos by pixels or percentage with locked aspect ratio — entirely in your browser.</p>
    </div>

    <div class="workspace-card">
      <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Upload image files">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
        </svg>
        <p>Drag and drop your images here, or click to browse</p>
        <p class="sub">PNG, JPG, WebP, GIF, BMP, AVIF — multiple files supported</p>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/avif,.png,.jpg,.jpeg,.webp,.gif,.bmp,.avif" multiple />
      </div>

      <div class="file-list" id="fileList"></div>

      <div class="settings-section" id="settingsSection">
        <div class="settings-grid">
          <div class="field">
            <label for="resizeMode">Resize mode</label>
            <select id="resizeMode">
              <option value="percent" selected>By percentage</option>
              <option value="width">By width (keep aspect)</option>
              <option value="height">By height (keep aspect)</option>
              <option value="fit">Fit inside box (keep aspect)</option>
              <option value="exact">Exact size (may stretch)</option>
            </select>
          </div>
          <div class="field" id="percentField">
            <label for="percentInput">Scale (%)</label>
            <input type="number" id="percentInput" min="1" max="500" value="50" />
          </div>
          <div class="field" id="widthField" style="display:none;">
            <label for="widthInput" id="widthLabel">Width (px)</label>
            <input type="number" id="widthInput" min="1" max="16384" placeholder="e.g. 1280" />
          </div>
          <div class="field" id="heightField" style="display:none;">
            <label for="heightInput" id="heightLabel">Height (px)</label>
            <input type="number" id="heightInput" min="1" max="16384" placeholder="e.g. 720" />
          </div>
          <div class="field">
            <label for="outFormat">Output format</label>
            <select id="outFormat">
              <option value="keep" selected>Keep original format</option>
              <option value="image/png">PNG</option>
              <option value="image/jpeg">JPG</option>
              <option value="image/webp">WebP</option>
            </select>
          </div>
          <div class="field" id="qualityField">
            <label for="qualitySlider">Quality <span class="range-value" id="qualityValue">90%</span></label>
            <input type="range" id="qualitySlider" min="50" max="100" value="90" step="1" />
          </div>
        </div>
        <label class="checkbox-field" style="margin-top:14px;">
          <input type="checkbox" id="noEnlarge" checked />
          Don't enlarge images that are already smaller than the target
        </label>
        <div class="info-box" id="infoBox"></div>
      </div>

      <div class="progress-bar-wrap" id="progressWrap">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="progress-label" id="progressLabel"></div>
      <button id="btnConvert" class="btn-action" disabled>Resize Images</button>
      <div id="statusMsg" class="status-msg"></div>
    </div>
  </main>

  <footer>
    <span class="dot"></span>No sign up required, Free forever<span class="dot"></span>
  </footer>

  <script>
    const activeTheme = localStorage.getItem('theme') || 'light';
    if (activeTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    document.getElementById('themeToggle').addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); }
      else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); }
      resetLogoLetters();
    });

    function incrementActionStats() {
      const count = parseInt(localStorage.getItem('docucraft_actions_total_count') || '0');
      localStorage.setItem('docucraft_actions_total_count', count + 1);
    }

    let activeStaggerTimeouts = [];
    function resetLogoLetters() {
      activeStaggerTimeouts.forEach(clearTimeout); activeStaggerTimeouts = [];
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.querySelectorAll('.logo-letter').forEach(l => { l.style.color = isDark ? '#f7f6f2' : '#1a1a18'; });
    }
    function initializeLogoHoverEngine() {
      const logoLink = document.querySelector('.header-logo');
      const letters = document.querySelectorAll('.logo-letter');
      logoLink.addEventListener('mouseenter', () => {
        activeStaggerTimeouts.forEach(clearTimeout); activeStaggerTimeouts = [];
        letters.forEach((letter, index) => {
          const id = setTimeout(() => { letter.style.color = `hsl(${Math.floor(Math.random()*360)}, 85%, 75%)`; }, index * 120);
          activeStaggerTimeouts.push(id);
        });
      });
      logoLink.addEventListener('mouseleave', resetLogoLetters);
    }

    function loadScriptWithFallback(urls) {
      return urls.reduce((chain, url) => chain.catch(() => new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url; s.onload = resolve;
        s.onerror = () => { s.remove(); reject(new Error('Failed to load ' + url)); };
        document.head.appendChild(s);
      })), Promise.reject());
    }
    const JSZIP_URLS = [
      'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
      'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
      'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'
    ];

    function formatBytes(bytes) {
      if (bytes >= 1048576) return (bytes / 1048576).toFixed(2) + ' MB';
      return (bytes / 1024).toFixed(1) + ' KB';
    }
    function downloadBlob(blob, name) {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = name;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 60000);
    }
    async function packageZip(results, zipName) {
      if (!window.JSZip) await loadScriptWithFallback(JSZIP_URLS);
      const zip = new JSZip();
      const usedNames = {};
      for (const r of results) {
        let name = r.name;
        if (usedNames[name] !== undefined) {
          usedNames[name]++;
          name = name.replace(/(\.[^.]+)$/, `_${usedNames[name]}$1`);
        } else { usedNames[name] = 0; }
        zip.file(name, await r.blob.arrayBuffer());
      }
      return zip.generateAsync({ type: 'blob' });
    }

    const SUPPORTS_WEBP_ENCODE = (() => {
      try { return document.createElement('canvas').toDataURL('image/webp').indexOf('data:image/webp') === 0; }
      catch (e) { return false; }
    })();

    let queuedFiles = [];

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const settingsSection = document.getElementById('settingsSection');
    const resizeMode = document.getElementById('resizeMode');
    const percentField = document.getElementById('percentField');
    const percentInput = document.getElementById('percentInput');
    const widthField = document.getElementById('widthField');
    const widthInput = document.getElementById('widthInput');
    const widthLabel = document.getElementById('widthLabel');
    const heightField = document.getElementById('heightField');
    const heightInput = document.getElementById('heightInput');
    const heightLabel = document.getElementById('heightLabel');
    const outFormat = document.getElementById('outFormat');
    const qualityField = document.getElementById('qualityField');
    const qualitySlider = document.getElementById('qualitySlider');
    const qualityValue = document.getElementById('qualityValue');
    const noEnlarge = document.getElementById('noEnlarge');
    const infoBox = document.getElementById('infoBox');
    const btnConvert = document.getElementById('btnConvert');
    const statusMsg = document.getElementById('statusMsg');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');

    if (!SUPPORTS_WEBP_ENCODE) {
      const webpOption = outFormat.querySelector('option[value="image/webp"]');
      webpOption.disabled = true;
      webpOption.textContent = 'WebP (not supported by this browser)';
    }

    function setProgress(pct, hide = false) {
      if (hide) { progressWrap.style.display = 'none'; progressFill.style.width = '0%'; progressLabel.style.display = 'none'; }
      else { progressWrap.style.display = 'block'; progressFill.style.width = `${pct}%`; }
    }
    function showStatus(msg, cls) { statusMsg.textContent = msg; statusMsg.className = `status-msg ${cls}`; }

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = 'var(--accent-mid)'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = 'var(--surface-3)'; });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault(); dropzone.style.borderColor = 'var(--surface-3)';
      if (e.dataTransfer.files.length > 0) addFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) addFiles(e.target.files); fileInput.value = ''; });

    qualitySlider.addEventListener('input', () => { qualityValue.textContent = `${qualitySlider.value}%`; });
    resizeMode.addEventListener('change', refreshSettingsUI);
    outFormat.addEventListener('change', refreshSettingsUI);

    const ACCEPTED_EXT = /\.(png|jpe?g|webp|gif|bmp|avif)$/i;

    function addFiles(newFiles) {
      let rejected = 0;
      for (const file of newFiles) {
        const looksLikeImage = file.type.startsWith('image/') || ACCEPTED_EXT.test(file.name);
        if (!looksLikeImage) { rejected++; continue; }
        const duplicate = queuedFiles.some(f => f.name === file.name && f.size === file.size);
        if (!duplicate) queuedFiles.push(file);
      }
      if (rejected > 0) showStatus(`${rejected} file${rejected !== 1 ? 's were' : ' was'} skipped — not a supported image type.`, 'status-error');
      else showStatus('', '');
      renderFileList();
    }

    function removeFile(index) {
      queuedFiles.splice(index, 1);
      renderFileList();
    }

    function renderFileList() {
      fileList.innerHTML = '';
      queuedFiles.forEach((file, index) => {
        const row = document.createElement('div');
        row.className = 'file-item';
        row.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span class="f-name"></span>
          <span class="f-meta">${formatBytes(file.size)}</span>
          <span class="f-status" data-status></span>
          <button class="f-remove" type="button" aria-label="Remove file">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>`;
        row.querySelector('.f-name').textContent = file.name;
        row.querySelector('.f-remove').addEventListener('click', () => removeFile(index));
        fileList.appendChild(row);
      });

      const hasFiles = queuedFiles.length > 0;
      fileList.style.display = hasFiles ? 'flex' : 'none';
      settingsSection.style.display = hasFiles ? 'block' : 'none';
      btnConvert.disabled = !hasFiles;
      refreshSettingsUI();
    }

    function refreshSettingsUI() {
      const mode = resizeMode.value;
      percentField.style.display = mode === 'percent' ? 'flex' : 'none';
      widthField.style.display = (mode === 'width' || mode === 'exact' || mode === 'fit') ? 'flex' : 'none';
      heightField.style.display = (mode === 'height' || mode === 'exact' || mode === 'fit') ? 'flex' : 'none';
      widthLabel.textContent = mode === 'fit' ? 'Max width (px)' : 'Width (px)';
      heightLabel.textContent = mode === 'fit' ? 'Max height (px)' : 'Height (px)';

      const fmt = outFormat.value;
      qualityField.style.display = fmt === 'image/png' ? 'none' : 'flex';

      if (queuedFiles.length === 0) { infoBox.style.display = 'none'; return; }
      const notes = [`${queuedFiles.length} image${queuedFiles.length !== 1 ? 's' : ''} ready — ${queuedFiles.length > 1 ? 'results will be packaged into a ZIP' : 'the result will download directly'}.`];
      if (fmt === 'keep') notes.push('GIF, BMP, and AVIF inputs are saved as PNG, since browsers cannot re-encode those formats.');
      infoBox.textContent = notes.join(' ');
      infoBox.style.display = 'block';
    }

    function decodeViaImgElement(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('This image could not be decoded.')); };
        img.src = url;
      });
    }

    async function decodeImage(file) {
      if (window.createImageBitmap) {
        try { return await createImageBitmap(file); } catch (e) { /* fall back to <img> decoding below */ }
      }
      return decodeViaImgElement(file);
    }

    function targetDims(w, h, opts) {
      let tw = w, th = h;
      if (opts.mode === 'percent') { tw = w * opts.percent / 100; th = h * opts.percent / 100; }
      else if (opts.mode === 'width') { tw = opts.width; th = h * (opts.width / w); }
      else if (opts.mode === 'height') { th = opts.height; tw = w * (opts.height / h); }
      else if (opts.mode === 'exact') { tw = opts.width; th = opts.height; }
      else if (opts.mode === 'fit') { const r = Math.min(opts.width / w, opts.height / h); tw = w * r; th = h * r; }
      // "Don't enlarge" leaves explicitly requested exact sizes alone.
      if (opts.noEnlarge && opts.mode !== 'exact' && (tw > w || th > h)) { tw = w; th = h; }
      return { w: Math.min(16384, Math.max(1, Math.round(tw))), h: Math.min(16384, Math.max(1, Math.round(th))) };
    }

    // Stepped halving keeps downscales sharp; a single drawImage jump looks muddy at large ratios.
    function scaleToCanvas(source, sw, sh, tw, th, fillWhite) {
      let cur = source, cw = sw, ch = sh;
      while (cw / 2 >= tw && ch / 2 >= th && cw > 64 && ch > 64) {
        const half = document.createElement('canvas');
        half.width = Math.max(tw, Math.floor(cw / 2));
        half.height = Math.max(th, Math.floor(ch / 2));
        const hctx = half.getContext('2d');
        hctx.imageSmoothingEnabled = true; hctx.imageSmoothingQuality = 'high';
        hctx.drawImage(cur, 0, 0, half.width, half.height);
        if (cur.close) cur.close();
        cur = half; cw = half.width; ch = half.height;
      }
      const out = document.createElement('canvas');
      out.width = tw; out.height = th;
      const ctx = out.getContext('2d');
      if (fillWhite) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, tw, th); }
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(cur, 0, 0, cw, ch, 0, 0, tw, th);
      if (cur.close) cur.close();
      return out;
    }

    function resolveFormat(file) {
      const choice = outFormat.value;
      if (choice !== 'keep') return choice;
      if (file.type === 'image/jpeg') return 'image/jpeg';
      if (file.type === 'image/webp' && SUPPORTS_WEBP_ENCODE) return 'image/webp';
      return 'image/png';
    }

    btnConvert.addEventListener('click', async () => {
      if (queuedFiles.length === 0) return;
      const opts = {
        mode: resizeMode.value,
        percent: parseFloat(percentInput.value) || 100,
        width: parseInt(widthInput.value) || 0,
        height: parseInt(heightInput.value) || 0,
        noEnlarge: noEnlarge.checked
      };
      if ((opts.mode === 'width' || opts.mode === 'exact' || opts.mode === 'fit') && opts.width <= 0) { showStatus('Enter a target width in pixels.', 'status-error'); return; }
      if ((opts.mode === 'height' || opts.mode === 'exact' || opts.mode === 'fit') && opts.height <= 0) { showStatus('Enter a target height in pixels.', 'status-error'); return; }

      btnConvert.disabled = true;
      showStatus('Resizing…', '');
      setProgress(2);
      progressLabel.style.display = 'block';

      const quality = parseInt(qualitySlider.value) / 100;
      const statusEls = fileList.querySelectorAll('[data-status]');
      const results = [];
      let failed = 0;

      try {
        for (let i = 0; i < queuedFiles.length; i++) {
          const file = queuedFiles[i];
          progressLabel.textContent = `Resizing ${i + 1} of ${queuedFiles.length}…`;
          try {
            const src = await decodeImage(file);
            const sw = src.width || src.naturalWidth, sh = src.height || src.naturalHeight;
            const { w, h } = targetDims(sw, sh, opts);
            const mimeType = resolveFormat(file);
            const canvas = scaleToCanvas(src, sw, sh, w, h, mimeType === 'image/jpeg');
            const blob = await new Promise(resolve => canvas.toBlob(resolve, mimeType, mimeType === 'image/png' ? undefined : quality));
            if (!blob) throw new Error('Encoding failed.');
            const ext = mimeType === 'image/jpeg' ? 'jpg' : mimeType === 'image/webp' ? 'webp' : 'png';
            results.push({ name: file.name.replace(/\.[^.]+$/, '') + `_${w}x${h}.` + ext, blob });
            if (statusEls[i]) { statusEls[i].textContent = `${sw}×${sh} → ${w}×${h} · ${formatBytes(blob.size)}`; statusEls[i].className = 'f-status ok'; }
          } catch (err) {
            failed++;
            if (statusEls[i]) { statusEls[i].textContent = 'failed'; statusEls[i].className = 'f-status err'; }
          }
          setProgress(2 + Math.round(((i + 1) / queuedFiles.length) * 83));
        }

        if (results.length === 0) throw new Error('none-converted');

        if (results.length === 1) {
          setProgress(100);
          downloadBlob(results[0].blob, results[0].name);
        } else {
          progressLabel.textContent = 'Creating ZIP…';
          setProgress(92);
          const zipBlob = await packageZip(results, 'resized');
          setProgress(100);
          downloadBlob(zipBlob, 'resized_images.zip');
        }

        incrementActionStats();
        const summary = `${results.length} image${results.length !== 1 ? 's' : ''} resized` +
          (failed > 0 ? ` — ${failed} file${failed !== 1 ? 's' : ''} could not be decoded.` : '.');
        showStatus(summary, failed > 0 ? 'status-error' : 'status-success');
      } catch (err) {
        console.error(err);
        showStatus('No images could be resized. The files may use a format your browser cannot decode.', 'status-error');
      } finally {
        btnConvert.disabled = queuedFiles.length === 0;
        progressLabel.style.display = 'none';
        setTimeout(() => setProgress(0, true), 1200);
      }
    });

    initializeLogoHoverEngine();
  </script>

  <script>
    (function () {
      const ease = 0.07;
      let target = window.scrollY, current = window.scrollY, raf = null;
      function hasScrollParent(el) {
        while (el && el !== document.documentElement) {
          const s = getComputedStyle(el);
          if ((s.overflowY === 'auto' || s.overflowY === 'scroll') && el.scrollHeight > el.clientHeight) return true;
          el = el.parentElement;
        }
        return false;
      }
      window.addEventListener('wheel', (e) => {
        if (hasScrollParent(e.target)) return;
        e.preventDefault();
        let delta = e.deltaY;
        if (e.deltaMode === 1) delta *= 40;
        else if (e.deltaMode === 2) delta *= window.innerHeight;
        target = Math.max(0, Math.min(target + delta * 0.8, document.documentElement.scrollHeight - window.innerHeight));
        if (!raf) raf = requestAnimationFrame(tick);
      }, { passive: false });
      function tick() {
        current += (target - current) * ease;
        if (Math.abs(target - current) < 0.5) { current = target; raf = null; window.scrollTo(0, current); return; }
        window.scrollTo(0, current);
        raf = requestAnimationFrame(tick);
      }
      window.addEventListener('scroll', () => { if (!raf) { target = window.scrollY; current = window.scrollY; } }, { passive: true });
    })();
  </script>
</body>
</html>
