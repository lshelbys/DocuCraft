  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #1a1a18; --ink-2: #4a4a46; --ink-3: #8a8a84;
      --surface: #f7f6f2; --surface-2: #eeecea; --surface-3: #e4e2dd;
      --white: #ffffff; --radius: 10px; --radius-lg: 16px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --accent: #2d5a3d; --accent-light: #e8f0ea; --accent-mid: #4a7c5c;
      --header-bg: rgba(255,255,255,0.35); --header-text: #1a1a18;
      --header-hover: #2d5a3d; --header-icon-color: #4a4a46;
      --header-border: rgba(255,255,255,0.4);
      --header-shadow: 0 4px 30px rgba(0,0,0,0.05);
      --header-highlight: rgba(255,255,255,0.9);
    }
    html[data-theme="dark"] {
      --ink: #f7f6f2; --ink-2: #c4c2be; --ink-3: #8a8a84;
      --surface: #121211; --surface-2: #1c1c1a; --surface-3: #2a2a27; --white: #1a1a18;
      --header-bg: rgba(20,20,18,0.45); --header-text: #f7f6f2; --header-hover: #7ec898;
      --header-icon-color: #8a8a84; --header-border: rgba(255,255,255,0.08);
      --header-shadow: 0 4px 30px rgba(0,0,0,0.3); --header-highlight: rgba(255,255,255,0.06);
    }
    body { font-family: 'DM Sans', sans-serif; background-color: var(--surface); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; }
    header {
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent 40%), var(--header-bg);
      padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(30px) saturate(200%) brightness(1.1);
      -webkit-backdrop-filter: blur(30px) saturate(200%) brightness(1.1);
      box-shadow: var(--header-shadow), inset 0 1px 1px var(--header-highlight), inset 0 -1px 0 rgba(0,0,0,0.05);
      border-bottom: 1px solid var(--header-border);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .header-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    header svg { color: #7ec898; flex-shrink: 0; }
    .header-text h1 { font-family: 'Instrument Serif', serif; font-size: 24px; letter-spacing: -0.01em; display: flex; user-select: none; transition: transform 0.6s cubic-bezier(0.25,1,0.5,1); transform-origin: left center; }
    .header-logo:hover .header-text h1 { transform: scale(1.1); }
    .header-text h1 .logo-letter { color: var(--header-text); transition: color 0.8s ease-in-out; display: inline-block; }
    .header-actions { display: flex; align-items: center; gap: 16px; }
    .header-btn { background: none; border: none; color: var(--header-icon-color); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: var(--transition); }
    .header-btn:hover { color: var(--header-hover); transform: scale(1.05); }
    .header-btn svg { color: inherit; fill: none; stroke: currentColor; }
    html[data-theme="dark"] .theme-toggle .moon-path { display: none; }
    html:not([data-theme="dark"]) .theme-toggle .sun-path { display: none; }
    .nav-back { text-decoration: none; color: var(--header-icon-color); font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: var(--transition); }
    .nav-back:hover { color: var(--header-hover); transform: translateX(-2px); }
    main { flex: 1; max-width: 960px; width: 100%; margin: 0 auto; padding: 40px 24px 60px; }
    .hero { text-align: center; margin-bottom: 32px; }
    .hero h2 { font-family: 'Instrument Serif', serif; font-size: 42px; font-weight: 400; line-height: 1.1; margin-bottom: 8px; }
    .hero p { color: var(--ink-2); font-size: 15px; }
    .workspace-card { background: var(--white); border: 1px solid var(--surface-3); border-radius: var(--radius-lg); padding: 24px; }
    .dropzone { border: 2px dashed var(--surface-3); border-radius: var(--radius); padding: 40px 20px; text-align: center; cursor: pointer; transition: var(--transition); background: var(--white); }
    .dropzone:hover, .dropzone:focus { border-color: var(--accent-mid); background: var(--accent-light); outline: none; }
    .dropzone svg { color: var(--ink-3); margin-bottom: 12px; }
    .dropzone p { font-size: 14px; color: var(--ink-2); }
    .dropzone input { display: none; }
    .editor-section { display: none; margin-top: 20px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .toolbar-left { font-size: 13px; color: var(--ink-3); }
    .toolbar-left strong { color: var(--ink); }
    .toolbar-right { display: flex; gap: 8px; }
    .tool-btn { padding: 7px 14px; border: 1px solid var(--surface-3); border-radius: var(--radius); background: var(--white); color: var(--ink-2); font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; transition: var(--transition); }
    .tool-btn:hover { border-color: var(--accent-mid); color: var(--accent); background: var(--accent-light); }
    .page-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
    .page-card {
      background: var(--surface); border: 2px solid var(--surface-3); border-radius: var(--radius);
      overflow: hidden; cursor: grab; transition: var(--transition); position: relative; user-select: none;
    }
    .page-card:hover { border-color: var(--accent-mid); }
    .page-card.dragging { opacity: 0.4; cursor: grabbing; }
    .page-card.drag-over { border-color: var(--accent); background: var(--accent-light); }
    .page-card canvas { width: 100%; display: block; }
    .page-card-footer { padding: 6px 8px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--surface-3); }
    .page-num { font-size: 11px; font-weight: 600; color: var(--ink-3); }
    .delete-btn {
      width: 20px; height: 20px; border-radius: 50%; border: none; background: transparent;
      color: var(--ink-3); cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: var(--transition); padding: 0; flex-shrink: 0;
    }
    .delete-btn:hover { background: #fde8e8; color: #a33b3b; }
    .progress-bar-wrap { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 20px; display: none; }
    .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; width: 0%; transition: width 0.3s ease; }
    .btn-save { width: 100%; margin-top: 20px; padding: 14px; background: var(--ink); color: var(--white); border: none; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 14px; cursor: pointer; transition: var(--transition); }
    .btn-save:hover:not(:disabled) { background: #333330; }
    .btn-save:disabled { background: var(--surface-2); color: var(--ink-3); cursor: not-allowed; border: 1px solid var(--surface-3); }
    .status-msg { margin-top: 14px; font-size: 13px; text-align: center; }
    .status-success { color: var(--accent); font-weight: 500; }
    .status-error { color: #a33b3b; font-weight: 500; }
    footer { text-align: center; padding: 20px 24px; font-size: 12px; color: var(--ink-3); border-top: 1px solid var(--surface-3); background: var(--white); margin-top: auto; }
    footer .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); display: inline-block; margin: 0 6px; vertical-align: middle; }
  </style>

<body>

        <h1>
          <span class="logo-letter">D</span><span class="logo-letter">o</span><span class="logo-letter">c</span>
          <span class="logo-letter">u</span><span class="logo-letter">C</span><span class="logo-letter">r</span>

            <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>

        Back to hub

  <main>
    <div class="hero">
      <h2>Reorder PDF Pages</h2>
      <p>Drag pages to rearrange or delete them, then save your new PDF — entirely in your browser.</p>
    </div>

    <div class="workspace-card">
      <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Upload PDF file">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
        </svg>
        <p>Drag and drop your PDF here, or click to browse</p>
        <input type="file" id="fileInput" accept="application/pdf" />
      </div>

      <div class="editor-section" id="editorSection">
        <div class="toolbar">
          <div class="toolbar-left">
            <strong id="pageCountLabel">0 pages</strong> — drag to reorder, click × to delete
          </div>
          <div class="toolbar-right">
            <button class="tool-btn" id="reverseBtn">Reverse order</button>
            <button class="tool-btn" id="loadNewBtn">Load new PDF</button>
          </div>
        </div>
        <div class="page-grid" id="pageGrid"></div>

        <div class="progress-bar-wrap" id="progressWrap">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <button class="btn-save" id="btnSave">Save Reordered PDF</button>
        <div id="statusMsg" class="status-msg"></div>
      </div>
    </div>

  <footer>
    <span class="dot"></span>No sign up required, Free forever<span class="dot"></span>
  </footer>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    });

    const activeTheme = localStorage.getItem('theme') || 'light';
    if (activeTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    document.getElementById('themeToggle').addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); }
      else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); }
      resetLogoLetters();
    });

    function incrementActionStats() {
      const count = parseInt(localStorage.getItem('docucraft_actions_total_count') || '0');
      localStorage.setItem('docucraft_actions_total_count', count + 1);
    }

    let activeStaggerTimeouts = [];
    function resetLogoLetters() {
      activeStaggerTimeouts.forEach(clearTimeout); activeStaggerTimeouts = [];
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.querySelectorAll('.logo-letter').forEach(l => { l.style.color = isDark ? '#f7f6f2' : '#1a1a18'; });
    }
    function initializeLogoHoverEngine() {
      const logoLink = document.querySelector('.header-logo');
      const letters = document.querySelectorAll('.logo-letter');
      logoLink.addEventListener('mouseenter', () => {
        activeStaggerTimeouts.forEach(clearTimeout); activeStaggerTimeouts = [];
        letters.forEach((letter, index) => {
          const id = setTimeout(() => { letter.style.color = `hsl(${Math.floor(Math.random()*360)}, 85%, 75%)`; }, index * 120);
          activeStaggerTimeouts.push(id);
        });
      });
      logoLink.addEventListener('mouseleave', resetLogoLetters);
    }

    let pdfArrayBuffer = null;
    let pageOrder = [];
    let dragSrcIndex = null;
    let originalFileName = 'document.pdf';

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const editorSection = document.getElementById('editorSection');
    const pageGrid = document.getElementById('pageGrid');
    const btnSave = document.getElementById('btnSave');
    const statusMsg = document.getElementById('statusMsg');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const pageCountLabel = document.getElementById('pageCountLabel');

    function setProgress(pct, hide = false) {
      if (hide) { progressWrap.style.display = 'none'; progressFill.style.width = '0%'; }
      else { progressWrap.style.display = 'block'; progressFill.style.width = `${pct}%`; }
    }
    function showStatus(msg, cls) { statusMsg.textContent = msg; statusMsg.className = `status-msg ${cls}`; }

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = 'var(--accent-mid)'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = 'var(--surface-3)'; });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault(); dropzone.style.borderColor = 'var(--surface-3)';
      if (e.dataTransfer.files.length > 0) loadPdf(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) loadPdf(e.target.files[0]); });

    document.getElementById('loadNewBtn').addEventListener('click', () => fileInput.click());
    document.getElementById('reverseBtn').addEventListener('click', () => {
      pageOrder.reverse();
      renderGrid();
    });

    async function loadPdf(file) {
      if (file.type !== 'application/pdf') { showStatus('Please upload a valid PDF file.', 'status-error'); return; }
      originalFileName = file.name;
      showStatus('Loading PDF…', '');
      try {
        pdfArrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: pdfArrayBuffer.slice(0) }).promise;
        pageOrder = Array.from({ length: pdf.numPages }, (_, i) => ({ originalIndex: i, canvas: null }));
        await renderCanvases(pdf);
        pdf.destroy(); // thumbnails are cached on canvases; the parsed doc isn't needed again
        editorSection.style.display = 'block';
        showStatus('', '');
      } catch (e) {
        console.error(e);
        showStatus('Failed to load PDF. The file may be encrypted or corrupted.', 'status-error');
      }
    }

    async function renderCanvases(pdf) {
      for (let i = 0; i < pageOrder.length; i++) {
        if (pageOrder[i].canvas) continue;
        const page = await pdf.getPage(pageOrder[i].originalIndex + 1);
        const viewport = page.getViewport({ scale: 0.35 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        pageOrder[i].canvas = canvas;
      }
      renderGrid();
    }

    function renderGrid() {
      pageCountLabel.textContent = `${pageOrder.length} page${pageOrder.length !== 1 ? 's' : ''}`;
      btnSave.disabled = pageOrder.length === 0;
      pageGrid.innerHTML = '';
      pageOrder.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'page-card';
        card.draggable = true;
        card.dataset.index = idx;
        card.appendChild(item.canvas);

        const footer = document.createElement('div');
        footer.className = 'page-card-footer';
        const num = document.createElement('span');
        num.className = 'page-num';
        num.textContent = `Page ${idx + 1}`;
        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.title = 'Remove page';
        del.innerHTML = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
        del.addEventListener('click', () => {
          pageOrder.splice(idx, 1);
          renderGrid();
        });
        footer.append(num, del);
        card.appendChild(footer);

        card.addEventListener('dragstart', (e) => {
          dragSrcIndex = idx;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        card.addEventListener('dragend', () => card.classList.remove('dragging'));
        card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('drag-over'); });
        card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
        card.addEventListener('drop', (e) => {
          e.preventDefault(); card.classList.remove('drag-over');
          if (dragSrcIndex !== null && dragSrcIndex !== idx) {
            const [moved] = pageOrder.splice(dragSrcIndex, 1);
            pageOrder.splice(idx, 0, moved);
            dragSrcIndex = null;
            renderGrid();
          }
        });

        pageGrid.appendChild(card);
      });
    }

    btnSave.addEventListener('click', async () => {
      if (!pdfArrayBuffer || pageOrder.length === 0) return;
      btnSave.disabled = true;
      showStatus('Saving PDF…', '');
      setProgress(10);

      try {
        const { PDFDocument } = PDFLib;
        const srcDoc = await PDFDocument.load(pdfArrayBuffer);
        const newDoc = await PDFDocument.create();
        setProgress(30);

        const indices = pageOrder.map(p => p.originalIndex);
        const copiedPages = await newDoc.copyPages(srcDoc, indices);
        copiedPages.forEach(page => newDoc.addPage(page));
        setProgress(80);

        const outBytes = await newDoc.save();
        setProgress(100);
        const blob = new Blob([outBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = originalFileName.replace(/\.pdf$/i, '') + '_reordered.pdf';
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 60000);
        incrementActionStats();
        showStatus('PDF saved successfully.', 'status-success');
      } catch (err) {
        console.error(err);
        showStatus('An error occurred while saving the PDF.', 'status-error');
      } finally {
        btnSave.disabled = pageOrder.length === 0;
        setTimeout(() => setProgress(0, true), 1200);
      }
    });

    initializeLogoHoverEngine();
  </script>
