  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { 
      --ink: #1a1a18; 
      --ink-2: #4a4a46;
      --ink-3: #8a8a84; 
      --surface: #f7f6f2; 
      --surface-2: #eeecea;
      --surface-3: #e4e2dd; 
      --white: #ffffff; 
      --radius: 10px; 
      --radius-lg: 16px; 
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --accent: #2d5a3d;
      --accent-light: #e8f0ea;
      --accent-mid: #4a7c5c;

      /* Header Colors - Light Mode: Liquid Glass */
      --header-bg: rgba(255, 255, 255, 0.35);
      --header-text: #1a1a18;
      --header-hover: #2d5a3d;
      --header-icon-color: #4a4a46;
      --header-border: rgba(255, 255, 255, 0.4);
      --header-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
      --header-highlight: rgba(255, 255, 255, 0.9);
    }

    html[data-theme="dark"] {
      --ink: #f7f6f2;
      --ink-2: #c4c2be;
      --ink-3: #8a8a84;
      --surface: #121211;
      --surface-2: #1c1c1a;
      --surface-3: #2a2a27;
      --white: #1a1a18;

      --header-bg: rgba(20, 20, 18, 0.45);
      --header-text: #f7f6f2;
      --header-hover: #7ec898;
      --header-icon-color: #8a8a84;
      --header-border: rgba(255, 255, 255, 0.08);
      --header-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      --header-highlight: rgba(255, 255, 255, 0.06);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--surface);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 40%), var(--header-bg);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;

      backdrop-filter: blur(30px) saturate(200%) brightness(1.1);
      -webkit-backdrop-filter: blur(30px) saturate(200%) brightness(1.1);
      box-shadow: 
        var(--header-shadow), 
        inset 0 1px 1px var(--header-highlight),
        inset 0 -1px 0 rgba(0, 0, 0, 0.05);
      border-bottom: 1px solid var(--header-border);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    header svg { color: #7ec898; flex-shrink: 0; }
    .header-text h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      letter-spacing: -0.01em;
      display: flex;
      user-select: none;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: left center;
    }
    .header-logo:hover .header-text h1 {
      transform: scale(1.1);
    }
    .header-text h1 .logo-letter {
      color: var(--header-text);
      transition: color 0.8s ease-in-out;
      display: inline-block;
    }
    .header-actions { display: flex; align-items: center; gap: 16px; }
    .header-btn {
      background: none;
      border: none;
      color: var(--header-icon-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: var(--transition);
    }
    .header-btn:hover { color: var(--header-hover); transform: scale(1.05); }
    .header-btn svg { color: inherit; fill: none; stroke: currentColor; }
    html[data-theme="dark"] .theme-toggle .moon-path { display: none; }
    html:not([data-theme="dark"]) .theme-toggle .sun-path { display: none; }
    .nav-back {
      text-decoration: none;
      color: var(--header-icon-color);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }
    .nav-back:hover { color: var(--header-hover); transform: translateX(-2px); }
    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }
    .hero {
      text-align: center;
      margin-bottom: 32px;
    }
    .hero h2 {
      font-family: 'Instrument Serif', serif;
      font-size: 42px;
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .hero p {
      color: var(--ink-2);
      font-size: 15px;
    }
    .workspace-card {
      background: var(--white);
      border: 1px solid var(--surface-3);
      border-radius: var(--radius-lg);
      padding: 24px;
    }
    .mode-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .mode-btn {
      padding: 12px;
      border: 1px solid var(--surface-3);
      background: var(--surface);
      border-radius: var(--radius);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      color: var(--ink-2);
      transition: var(--transition);
    }
    .mode-btn.active {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }
    .dropzone {
      border: 2px dashed var(--surface-3);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      background: var(--white);
    }
    .dropzone:hover {
      border-color: var(--accent-mid);
      background: var(--surface);
    }
    .dropzone svg {
      color: var(--ink-3);
      margin-bottom: 12px;
    }
    .dropzone p {
      font-size: 14px;
      color: var(--ink-2);
    }
    .dropzone input { display: none; }
    .file-details {
      margin-top: 20px;
      display: none;
    }
    .file-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--surface-3);
    }
    .file-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .file-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
    }
    .btn-convert {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: var(--ink);
      color: var(--white);
      border: none;
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-convert:hover:not(:disabled) { background: #333330; }
    .btn-convert:disabled {
      background: var(--surface-3);
      color: var(--ink-3);
      cursor: not-allowed;
    }
    .progress-bar-wrap { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; width: 0%; transition: width 0.3s ease; }
    .status-msg {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
    }
    .status-success { color: var(--accent); font-weight: 500; }
    .status-error { color: #a33b3b; font-weight: 500; }
    
    footer { 
      text-align: center; 
      padding: 20px 24px; 
      font-size: 12px; 
      color: var(--ink-3); 
      border-top: 1px solid var(--surface-3); 
      background: var(--white); 
      margin-top: auto;
    }
    footer .dot { 
      width: 4px; 
      height: 4px; 
      border-radius: 50%; 
      background: var(--accent); 
      display: inline-block; 
      margin: 0 6px; 
      vertical-align: middle; 
    }
  </style>

  <script src="/app.js" defer></script>
</head>
<body>

  <main>
    <div class="hero">
      <h2>PDF Converter</h2>
      <p>Convert images to PDF, or extract text and images from an existing PDF.</p>
    </div>

    <div class="workspace-card">
      <div class="mode-selector">
        <button id="modeToPdf" class="mode-btn active">Image to PDF</button>
        <button id="modeFromPdf" class="mode-btn">Extract from PDF</button>
      </div>

      <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Upload file">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
        </svg>
        <p id="dropzoneText">Drag and drop an image (PNG, JPG) or click to browse</p>
        <input type="file" id="fileInput" />
      </div>

      <div class="file-details" id="fileDetails">
        <div class="file-row">
          <div class="file-info">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span class="file-name" id="fileNameDisplay">filename.ext</span>
          </div>
        </div>
      </div>

      <div class="progress-bar-wrap" id="progressWrap" style="display:none; margin-top:16px;">
        <div class="progress-bar-fill" id="progressFill"></div>

      <button id="btnConvert" class="btn-convert" disabled>Convert</button>

    </div>

  <footer>
    <span class="dot"></span>No sign up required, Free forever<span class="dot"></span>
  </footer>

  <script>
    const activeTheme = localStorage.getItem('theme') || 'light';
    if (activeTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
      resetLogoLetters();
    });

    function incrementActionStats() {
      const count = parseInt(localStorage.getItem('docucraft_actions_total_count') || '0');
      localStorage.setItem('docucraft_actions_total_count', count + 1);
    }

    let activeStaggerTimeouts = [];
    function resetLogoLetters() {
      activeStaggerTimeouts.forEach(clearTimeout);
      activeStaggerTimeouts = [];
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.querySelectorAll('.logo-letter').forEach(l => {
        l.style.color = isDark ? '#f7f6f2' : '#1a1a18';
      });
    }

    function initializeLogoHoverEngine() {
      const logoLink = document.querySelector('.header-logo');
      const letters = document.querySelectorAll('.logo-letter');
      logoLink.addEventListener('mouseenter', () => {
        activeStaggerTimeouts.forEach(clearTimeout);
        activeStaggerTimeouts = [];
        letters.forEach((letter, index) => {
          const timeoutId = setTimeout(() => {
            const randomHue = Math.floor(Math.random() * 360);
            letter.style.color = `hsl(${randomHue}, 85%, 75%)`;
          }, index * 120);
          activeStaggerTimeouts.push(timeoutId);
        });
      });
      logoLink.addEventListener('mouseleave', resetLogoLetters);
    }

    window.addEventListener('DOMContentLoaded', () => {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    });

    let currentMode = 'toPdf';
    let targetFile = null;

    const modeToPdf = document.getElementById('modeToPdf');
    const modeFromPdf = document.getElementById('modeFromPdf');
    const dropzone = document.getElementById('dropzone');
    const dropzoneText = document.getElementById('dropzoneText');
    const fileInput = document.getElementById('fileInput');
    const fileDetails = document.getElementById('fileDetails');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const btnConvert = document.getElementById('btnConvert');
    const statusMsg = document.getElementById('statusMsg');

    modeToPdf.addEventListener('click', () => switchMode('toPdf'));
    modeFromPdf.addEventListener('click', () => switchMode('fromPdf'));

    function switchMode(mode) {
      currentMode = mode;
      targetFile = null;
      fileDetails.style.display = 'none';
      btnConvert.disabled = true;
      clearStatus();
      
      if (mode === 'toPdf') {
        modeToPdf.classList.add('active');
        modeFromPdf.classList.remove('active');
        dropzoneText.innerText = 'Drag and drop an image (PNG, JPG) or click to browse';
        fileInput.accept = 'image/png, image/jpeg';
      } else {
        modeFromPdf.classList.add('active');
        modeToPdf.classList.remove('active');
        dropzoneText.innerText = 'Drag and drop a PDF file or click to browse';
        fileInput.accept = 'application/pdf';
      }
    }

    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    function setProgress(pct, hide = false) {
      if (hide) { progressWrap.style.display = 'none'; progressFill.style.width = '0%'; }
      else { progressWrap.style.display = 'block'; progressFill.style.width = `${pct}%`; }
    }

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = 'var(--accent-mid)'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = 'var(--surface-3)'; });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = 'var(--surface-3)';
      if (e.dataTransfer.files.length > 0) handleFileSelection(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFileSelection(e.target.files[0]);
    });

    function handleFileSelection(file) {
      if (currentMode === 'toPdf' && !/^image\/(png|jpe?g)$/.test(file.type) && !/\.(png|jpe?g)$/i.test(file.name)) {
        showStatus('Please upload a PNG or JPG image — other image formats aren’t supported by this tool yet.', 'status-error');
        return;
      }
      if (currentMode === 'fromPdf' && file.type !== 'application/pdf') {
        showStatus('Please upload a valid PDF file.', 'status-error');
        return;
      }
      targetFile = file;
      fileNameDisplay.innerText = `${file.name} (${formatBytes(file.size)})`;
      fileDetails.style.display = 'block';
      btnConvert.disabled = false;
      clearStatus();
    }

    btnConvert.addEventListener('click', async () => {
      if (!targetFile) return;
      btnConvert.disabled = true;
      showStatus('Converting…', '');
      setProgress(10);

      try {
        if (currentMode === 'toPdf') {
          await convertImageToPdf(targetFile);
        } else {
          await convertPdfToElements(targetFile);
        }
      } catch (err) {
        console.error(err);
        showStatus('An error occurred while converting the file.', 'status-error');
      } finally {
        btnConvert.disabled = false;
        setTimeout(() => setProgress(0, true), 1200);
      }
    });

    async function convertImageToPdf(file) {
      setProgress(30);
      const pdfDoc = await PDFLib.PDFDocument.create();
      const arrayBuffer = await file.arrayBuffer();
      setProgress(60);
      const isPng = file.type === 'image/png' || (!file.type && /\.png$/i.test(file.name));
      const image = isPng ? await pdfDoc.embedPng(arrayBuffer) : await pdfDoc.embedJpg(arrayBuffer);
      const page = pdfDoc.addPage([image.width, image.height]);
      page.drawImage(image, { x: 0, y: 0, width: image.width, height: image.height });
      setProgress(85);
      const pdfBytes = await pdfDoc.save();
      setProgress(100);
      downloadBlob(pdfBytes, `${file.name.replace(/\.[^.]+$/, '')}_converted.pdf`, 'application/pdf');
      incrementActionStats();
      showStatus('Image converted to PDF successfully.', 'status-success');
    }

    async function convertPdfToElements(file) {
      const arrayBuffer = await file.arrayBuffer();
      setProgress(20);
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let textLog = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const txt = await page.getTextContent();
        textLog += `--- Page ${i} ---\n` + txt.items.map(item => item.str).join(' ') + '\n\n';
        setProgress(20 + Math.round((i / pdf.numPages) * 50));
      }
      downloadBlob(new TextEncoder().encode(textLog), `${file.name.replace(/\.[^.]+$/, '')}_extracted.txt`, 'text/plain');
      setProgress(80);
      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;
      await page.render({ canvasContext: ctx, viewport }).promise;
      const previewBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (previewBlob) downloadBlob(previewBlob, `${file.name.replace(/\.[^.]+$/, '')}_preview.png`, 'image/png');
      setProgress(100);
      incrementActionStats();
      showStatus('Text and preview image extracted successfully.', 'status-success');
    }

    function formatBytes(bytes) {
      if (bytes >= 1048576) return (bytes / 1048576).toFixed(2) + ' MB';
      return (bytes / 1024).toFixed(1) + ' KB';
    }
    function downloadBlob(b, n, c) {
      const blob = b instanceof Blob ? b : new Blob([b], { type: c });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = n;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    }

    function showStatus(msg, cls) { statusMsg.innerText = msg; statusMsg.className = `status-msg ${cls}`; }
    function clearStatus() { statusMsg.innerText = ''; statusMsg.className = 'status-msg'; }
    initializeLogoHoverEngine();
  </script>

  <script>
    (function () {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const ease = 0.07;
      let target = window.scrollY, current = window.scrollY, raf = null;

      function hasScrollParent(el) {
        while (el && el !== document.documentElement) {
          const s = getComputedStyle(el);
          if ((s.overflowY === 'auto' || s.overflowY === 'scroll') && el.scrollHeight > el.clientHeight) return true;
          el = el.parentElement;
        }
        return false;
      }

      window.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) return;
        if (hasScrollParent(e.target)) return;
        e.preventDefault();
        let delta = e.deltaY;
        if (e.deltaMode === 1) delta *= 40;
        else if (e.deltaMode === 2) delta *= window.innerHeight;
        target = Math.max(0, Math.min(target + delta * 0.8, document.documentElement.scrollHeight - window.innerHeight));
        if (!raf) raf = requestAnimationFrame(tick);
      }, { passive: false });

      function tick() {
        current += (target - current) * ease;
        if (Math.abs(target - current) < 0.5) { current = target; raf = null; window.scrollTo(0, current); return; }
        window.scrollTo(0, current);
        raf = requestAnimationFrame(tick);
      }

      window.addEventListener('scroll', () => { if (!raf) { target = window.scrollY; current = window.scrollY; } }, { passive: true });
    })();
  </script>
</body>
</html>
