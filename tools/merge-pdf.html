  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { 
      --ink: #1a1a18; 
      --ink-2: #4a4a46;
      --ink-3: #8a8a84; 
      --surface: #f7f6f2; 
      --surface-2: #eeecea;
      --surface-3: #e4e2dd; 
      --white: #ffffff; 
      --radius: 10px; 
      --radius-lg: 16px; 
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --accent: #2d5a3d;
      --accent-light: #e8f0ea;
      --accent-mid: #4a7c5c;

      /* Header Colors - Light Mode: Liquid Glass */
      --header-bg: rgba(255, 255, 255, 0.35);
      --header-text: #1a1a18;
      --header-hover: #2d5a3d;
      --header-icon-color: #4a4a46;
      --header-border: rgba(255, 255, 255, 0.4);
      --header-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
      --header-highlight: rgba(255, 255, 255, 0.9);
    }

    html[data-theme="dark"] {
      --ink: #f7f6f2;
      --ink-2: #c4c2be;
      --ink-3: #8a8a84;
      --surface: #121211;
      --surface-2: #1c1c1a;
      --surface-3: #2a2a27;
      --white: #1a1a18;

      --header-bg: rgba(20, 20, 18, 0.45);
      --header-text: #f7f6f2;
      --header-hover: #7ec898;
      --header-icon-color: #8a8a84;
      --header-border: rgba(255, 255, 255, 0.08);
      --header-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      --header-highlight: rgba(255, 255, 255, 0.06);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--surface);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 40%), var(--header-bg);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(30px) saturate(200%) brightness(1.1);
      -webkit-backdrop-filter: blur(30px) saturate(200%) brightness(1.1);
      box-shadow:
        var(--header-shadow),
        inset 0 1px 1px var(--header-highlight),
        inset 0 -1px 0 rgba(0, 0, 0, 0.05);
      border-bottom: 1px solid var(--header-border);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    header svg { color: #7ec898; flex-shrink: 0; }
    .header-text h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      letter-spacing: -0.01em;
      display: flex;
      user-select: none;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: left center;
    }
    .header-logo:hover .header-text h1 {
      transform: scale(1.1);
    }
    .header-text h1 .logo-letter {
      color: var(--header-text);
      transition: color 0.8s ease-in-out;
      display: inline-block;
    }
    .header-actions { display: flex; align-items: center; gap: 16px; }
    .header-btn {
      background: none;
      border: none;
      color: var(--header-icon-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: var(--transition);
    }
    .header-btn:hover { color: var(--header-hover); transform: scale(1.05); }
    .header-btn svg { color: inherit; fill: none; stroke: currentColor; }
    html[data-theme="dark"] .theme-toggle .moon-path { display: none; }
    html:not([data-theme="dark"]) .theme-toggle .sun-path { display: none; }
    .nav-back {
      text-decoration: none;
      color: var(--header-icon-color);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }
    .nav-back:hover { color: var(--header-hover); transform: translateX(-2px); }

    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }
    .hero {
      text-align: center;
      margin-bottom: 32px;
    }
    .hero h2 {
      font-family: 'Instrument Serif', serif;
      font-size: 42px;
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .hero p {
      color: var(--ink-2);
      font-size: 15px;
    }
    .workspace-card {
      background: var(--white);
      border: 1px solid var(--surface-3);
      border-radius: var(--radius-lg);
      padding: 24px;
    }
    .dropzone {
      border: 2px dashed var(--surface-3);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      background: var(--white);
    }
    .dropzone:hover {
      border-color: var(--accent-mid);
      background: var(--surface);
    }
    .dropzone svg {
      color: var(--ink-3);
      margin-bottom: 12px;
    }
    .dropzone p {
      font-size: 14px;
      color: var(--ink-2);
    }
    .dropzone input { display: none; }
    
    .file-list {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--surface-3);
      border-radius: var(--radius);
      cursor: grab;
      transition: var(--transition);
    }
    .file-item:active { cursor: grabbing; }
    .file-item.dragging { opacity: 0.4; }
    .file-item.drag-over { border-color: var(--accent); background: var(--accent-light); }
    .drag-handle {
      color: var(--ink-3);
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .file-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .reorder-hint {
      font-size: 12px;
      color: var(--ink-3);
      margin-top: 16px;
      margin-bottom: -4px;
      text-align: center;
    }
    .file-name {
      font-size: 14px;
      font-weight: 500;
    }
    .file-size {
      font-size: 12px;
      color: var(--ink-3);
    }
    .item-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .control-btn {
      background: var(--white);
      border: 1px solid var(--surface-3);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: var(--transition);
    }
    .control-btn:hover {
      background: var(--surface-2);
    }
    .progress-bar-wrap { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 20px; display: none; }
    .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; width: 0%; transition: width 0.3s ease; }
    .btn-merge {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: var(--ink);
      color: var(--white);
      border: none;
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-merge:hover:not(:disabled) { background: #333330; }
    .btn-merge:disabled {
      background: var(--surface-2);
      color: var(--ink-3);
      cursor: not-allowed;
      border: 1px solid var(--surface-3);
    }
    .status-msg {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
    }
    .status-success { color: var(--accent); font-weight: 500; }
    .status-error { color: #a33b3b; font-weight: 500; }

    footer { text-align: center; padding: 20px 24px; font-size: 12px; color: var(--ink-3); border-top: 1px solid var(--surface-3); background: var(--white); margin-top: auto; }
    footer .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); display: inline-block; margin: 0 6px; vertical-align: middle; }
  </style>
  <link rel="stylesheet" href="/app.css" />
  <script src="/app.js" defer></script>
</head>
<body>

  <header>
    <a href="../" class="header-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
        <line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/>
      </svg>

          <span class="logo-letter">D</span>

        Back to hub
      </a>

  <main>
    <div class="hero">
      <h2>Merge PDF</h2>
      <p>Combine multiple PDF files into one document in any order you choose.</p>
    </div>

    <div class="workspace-card">
      <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Upload PDF files">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
        </svg>
        <p>Drag and drop PDF files here, or click to browse</p>
        <input type="file" id="fileInput" multiple accept="application/pdf" />
      </div>

      <div class="reorder-hint" id="reorderHint" style="display:none;">Drag files to reorder them, or use the arrow buttons</div>
      <div class="file-list" id="fileList"></div>

      <div class="progress-bar-wrap" id="progressWrap">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <button id="btnMerge" class="btn-merge" disabled>Merge PDFs</button>
      <div id="statusMsg" class="status-msg"></div>
    </div>
  </main>

  <footer>
    <span class="dot"></span>No sign up required, Free forever<span class="dot"></span>
  </footer>

  <script>
    const activeTheme = localStorage.getItem('theme') || 'light';
    if (activeTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
      resetLogoLetters();
    });

    function incrementActionStats() {
      const count = parseInt(localStorage.getItem('docucraft_actions_total_count') || '0');
      localStorage.setItem('docucraft_actions_total_count', count + 1);
    }

    let activeStaggerTimeouts = [];
    function resetLogoLetters() {
      activeStaggerTimeouts.forEach(clearTimeout);
      activeStaggerTimeouts = [];
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.querySelectorAll('.logo-letter').forEach(l => {
        l.style.color = isDark ? '#f7f6f2' : '#1a1a18';
      });
    }

    function initializeLogoHoverEngine() {
      const logoLink = document.querySelector('.header-logo');
      const letters = document.querySelectorAll('.logo-letter');
      logoLink.addEventListener('mouseenter', () => {
        activeStaggerTimeouts.forEach(clearTimeout);
        activeStaggerTimeouts = [];
        letters.forEach((letter, index) => {
          const timeoutId = setTimeout(() => {
            const randomHue = Math.floor(Math.random() * 360);
            letter.style.color = `hsl(${randomHue}, 85%, 75%)`;
          }, index * 120);
          activeStaggerTimeouts.push(timeoutId);
        });
      });
      logoLink.addEventListener('mouseleave', resetLogoLetters);
    }

    let selectedFiles = [];

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const btnMerge = document.getElementById('btnMerge');
    const statusMsg = document.getElementById('statusMsg');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');

    function setProgress(pct, hide = false) {
      if (hide) { progressWrap.style.display = 'none'; progressFill.style.width = '0%'; }
      else { progressWrap.style.display = 'block'; progressFill.style.width = `${pct}%`; }
    }

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = 'var(--accent-mid)'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = 'var(--surface-3)'; });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = 'var(--surface-3)';
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    function handleFiles(files) {
      let skipped = 0;
      for (let i = 0; i < files.length; i++) {
        if (files[i].type === 'application/pdf') {
          selectedFiles.push(files[i]);
        } else {
          skipped++;
        }
      }
      if (skipped > 0) {
        statusMsg.innerText = `${skipped} file${skipped > 1 ? 's' : ''} skipped — only PDF files are supported.`;
        statusMsg.className = 'status-msg status-error';
      }
      updateUI();
    }

    let dragSrcIndex = null;
    const reorderHint = document.getElementById('reorderHint');

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function formatBytes(bytes) {
      if (bytes >= 1048576) return (bytes / 1048576).toFixed(2) + ' MB';
      return (bytes / 1024).toFixed(1) + ' KB';
    }

    function updateUI() {
      fileList.innerHTML = '';

      selectedFiles.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'file-item';
        item.draggable = true;
        item.dataset.index = index;
        item.innerHTML = `
          <div class="file-meta">
            <span class="drag-handle" aria-hidden="true" title="Drag to reorder">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg>
            </span>
            <span class="file-name">${escapeHtml(file.name)}</span>
            <span class="file-size">(${formatBytes(file.size)})</span>
          </div>
          <div class="item-controls">
            <button class="control-btn" data-action="up" title="Move Up" aria-label="Move up">↑</button>
            <button class="control-btn" data-action="down" title="Move Down" aria-label="Move down">↓</button>
            <button class="control-btn" data-action="remove" style="color: #a33b3b;" title="Remove File" aria-label="Remove file">✕</button>
          </div>
        `;

        item.querySelector('[data-action="up"]').addEventListener('click', () => moveUp(index));
        item.querySelector('[data-action="down"]').addEventListener('click', () => moveDown(index));
        item.querySelector('[data-action="remove"]').addEventListener('click', () => removeFile(index));

        item.addEventListener('dragstart', (e) => {
          dragSrcIndex = index;
          item.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        item.addEventListener('dragend', () => item.classList.remove('dragging'));
        item.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          if (dragSrcIndex !== null && dragSrcIndex !== index) item.classList.add('drag-over');
        });
        item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
        item.addEventListener('drop', (e) => {
          e.preventDefault();
          item.classList.remove('drag-over');
          if (dragSrcIndex !== null && dragSrcIndex !== index) {
            const [moved] = selectedFiles.splice(dragSrcIndex, 1);
            selectedFiles.splice(index, 0, moved);
            dragSrcIndex = null;
            updateUI();
          }
        });

        fileList.appendChild(item);
      });

      reorderHint.style.display = selectedFiles.length >= 2 ? 'block' : 'none';
      btnMerge.disabled = selectedFiles.length < 2;
    }

    function moveUp(index) {
      if (index === 0) return;
      [selectedFiles[index - 1], selectedFiles[index]] = [selectedFiles[index], selectedFiles[index - 1]];
      updateUI();
    }
    function moveDown(index) {
      if (index === selectedFiles.length - 1) return;
      [selectedFiles[index + 1], selectedFiles[index]] = [selectedFiles[index], selectedFiles[index + 1]];
      updateUI();
    }
    function removeFile(index) {
      selectedFiles.splice(index, 1);
      updateUI();
    }

    btnMerge.addEventListener('click', async () => {
      if (selectedFiles.length < 2) return;
      
      statusMsg.innerText = '';
      statusMsg.className = 'status-msg';
      btnMerge.disabled = true;
      setProgress(5);

      try {
        const mergedPdf = await PDFLib.PDFDocument.create();

        for (let i = 0; i < selectedFiles.length; i++) {
          const fileArrayBuffer = await selectedFiles[i].arrayBuffer();
          const pdfDoc = await PDFLib.PDFDocument.load(fileArrayBuffer);
          const copiedPages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
          copiedPages.forEach((page) => mergedPdf.addPage(page));
          setProgress(5 + Math.round(((i + 1) / selectedFiles.length) * 85));
        }

        setProgress(95);
        const mergedPdfBytes = await mergedPdf.save();
        setProgress(100);

        const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'DocuCraft_Merged.pdf';
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 60000);
        incrementActionStats();

        statusMsg.innerText = 'PDFs merged successfully!';
        statusMsg.className = 'status-msg status-success';
      } catch (error) {
        console.error(error);
        statusMsg.innerText = 'An error occurred while merging. Ensure files are not encrypted or corrupted.';
        statusMsg.className = 'status-msg status-error';
      } finally {
        btnMerge.disabled = false;
        setTimeout(() => setProgress(0, true), 1200);
      }
    });
    initializeLogoHoverEngine();
  </script>

  <script>
    (function () {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const ease = 0.07;
      let target = window.scrollY, current = window.scrollY, raf = null;

      function hasScrollParent(el) {
        while (el && el !== document.documentElement) {
          const s = getComputedStyle(el);
          if ((s.overflowY === 'auto' || s.overflowY === 'scroll') && el.scrollHeight > el.clientHeight) return true;
          el = el.parentElement;
        }
        return false;
      }

      window.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) return;
        if (hasScrollParent(e.target)) return;
        e.preventDefault();
        let delta = e.deltaY;
        if (e.deltaMode === 1) delta *= 40;
        else if (e.deltaMode === 2) delta *= window.innerHeight;
        target = Math.max(0, Math.min(target + delta * 0.8, document.documentElement.scrollHeight - window.innerHeight));
        if (!raf) raf = requestAnimationFrame(tick);
      }, { passive: false });

      function tick() {
        current += (target - current) * ease;
        if (Math.abs(target - current) < 0.5) { current = target; raf = null; window.scrollTo(0, current); return; }
        window.scrollTo(0, current);
        raf = requestAnimationFrame(tick);
      }

      window.addEventListener('scroll', () => { if (!raf) { target = window.scrollY; current = window.scrollY; } }, { passive: true });
    })();
  </script>
</body>
</html>
