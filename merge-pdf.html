<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocuCraft - Merge PDF</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { 
      --ink: #1a1a18; 
      --ink-2: #4a4a46;
      --ink-3: #8a8a84; 
      --surface: #f7f6f2; 
      --surface-2: #eeecea;
      --surface-3: #e4e2dd; 
      --white: #ffffff; 
      --radius: 10px; 
      --radius-lg: 16px; 
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --accent: #2d5a3d;
      --accent-light: #e8f0ea;
      --accent-mid: #4a7c5c;

      /* Header Colors - Light Mode: Liquid Glass */
      --header-bg: rgba(255, 255, 255, 0.35);
      --header-text: #1a1a18;
      --header-hover: #2d5a3d;
      --header-icon-color: #4a4a46;
      --header-border: rgba(255, 255, 255, 0.4);
      --header-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
      --header-highlight: rgba(255, 255, 255, 0.9);
    }

    html[data-theme="dark"] {
      --ink: #f7f6f2;
      --ink-2: #c4c2be;
      --ink-3: #8a8a84;
      --surface: #121211;
      --surface-2: #1c1c1a;
      --surface-3: #2a2a27;
      --white: #1a1a18;

      --header-bg: rgba(20, 20, 18, 0.45);
      --header-text: #f7f6f2;
      --header-hover: #7ec898;
      --header-icon-color: #8a8a84;
      --header-border: rgba(255, 255, 255, 0.08);
      --header-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      --header-highlight: rgba(255, 255, 255, 0.06);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--surface);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--white);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--surface-3);
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    header svg { color: #7ec898; flex-shrink: 0; }
    .header-text h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      letter-spacing: -0.01em;
      display: flex;
      user-select: none;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: left center;
    }
    .header-logo:hover .header-text h1 {
      transform: scale(1.1);
    }
    .header-text h1 .logo-letter {
      color: var(--header-text);
      transition: color 0.8s ease-in-out;
      display: inline-block;
    }
    .nav-back {
      text-decoration: none;
      color: var(--header-icon-color);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }
    .nav-back:hover { color: var(--header-hover); transform: translateX(-2px); }

    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }
    .hero {
      text-align: center;
      margin-bottom: 32px;
    }
    .hero h2 {
      font-family: 'Instrument Serif', serif;
      font-size: 42px;
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .hero p {
      color: var(--ink-2);
      font-size: 15px;
    }
    .workspace-card {
      background: var(--white);
      border: 1px solid var(--surface-3);
      border-radius: var(--radius-lg);
      padding: 24px;
    }
    .dropzone {
      border: 2px dashed var(--surface-3);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      background: var(--white);
    }
    .dropzone:hover {
      border-color: var(--accent-mid);
      background: var(--surface);
    }
    .dropzone svg {
      color: var(--ink-3);
      margin-bottom: 12px;
    }
    .dropzone p {
      font-size: 14px;
      color: var(--ink-2);
    }
    .dropzone input { display: none; }
    
    .file-list {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--surface-3);
      border-radius: var(--radius);
    }
    .file-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .file-name {
      font-size: 14px;
      font-weight: 500;
    }
    .file-size {
      font-size: 12px;
      color: var(--ink-3);
    }
    .item-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .control-btn {
      background: var(--white);
      border: 1px solid var(--surface-3);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: var(--transition);
    }
    .control-btn:hover {
      background: var(--surface-2);
    }
    .btn-merge {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: var(--ink);
      color: var(--white);
      border: none;
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-merge:hover:not(:disabled) { background: #333330; }
    .btn-merge:disabled {
      background: var(--surface-2);
      color: var(--ink-3);
      cursor: not-allowed;
      border: 1px solid var(--surface-3);
    }
    .status-msg {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
    }
    .status-success { color: var(--accent); font-weight: 500; }
    .status-error { color: #a33b3b; font-weight: 500; }

    footer { text-align: center; padding: 20px 24px; font-size: 12px; color: var(--ink-3); border-top: 1px solid var(--surface-3); background: var(--white); margin-top: auto; }
    footer .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); display: inline-block; margin: 0 6px; vertical-align: middle; }
  </style>
</head>
<body>

  <header>
    <a href="./" class="header-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
        <line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/>
      </svg>
      <div class="header-text">
        <h1>
          <span class="logo-letter">D</span>
          <span class="logo-letter">o</span>
          <span class="logo-letter">c</span>
          <span class="logo-letter">u</span>
          <span class="logo-letter">C</span>
          <span class="logo-letter">r</span>
          <span class="logo-letter">a</span>
          <span class="logo-letter">f</span>
          <span class="logo-letter">t</span>
        </h1>
      </div>
    </a>
    <a href="./" class="nav-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to hub
    </a>
  </header>

  <main>
    <div class="hero">
      <h2>Merge PDF Workspace</h2>
      <p>Combine disjointed document layers into a cohesive asset package sequentially.</p>
    </div>

    <div class="workspace-card">
      <div class="dropzone" id="dropzone">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
        </svg>
        <p>Drag and drop structural PDFs or click to navigate local arrays</p>
        <input type="file" id="fileInput" multiple accept="application/pdf" />
      </div>

      <div class="file-list" id="fileList"></div>

      <button id="btnMerge" class="btn-merge" disabled>Execute Structural Merging</button>
      <div id="statusMsg" class="status-msg"></div>
    </div>
  </main>

  <footer>
    <span class="dot"></span>No sign up required, Free forever<span class="dot"></span>
  </footer>

  <script>
    const activeTheme = localStorage.getItem('theme') || 'light';
    if (activeTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }

    function incrementActionStats() {
      const count = parseInt(localStorage.getItem('docucraft_actions_total_count') || '0');
      localStorage.setItem('docucraft_actions_total_count', count + 1);
    }

    let activeStaggerTimeouts = [];
    function resetLogoLetters() {
      activeStaggerTimeouts.forEach(clearTimeout);
      activeStaggerTimeouts = [];
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.querySelectorAll('.logo-letter').forEach(l => {
        l.style.color = isDark ? '#f7f6f2' : '#1a1a18';
      });
    }

    function initializeLogoHoverEngine() {
      const logoLink = document.querySelector('.header-logo');
      const letters = document.querySelectorAll('.logo-letter');
      logoLink.addEventListener('mouseenter', () => {
        activeStaggerTimeouts.forEach(clearTimeout);
        activeStaggerTimeouts = [];
        letters.forEach((letter, index) => {
          const timeoutId = setTimeout(() => {
            const randomHue = Math.floor(Math.random() * 360);
            letter.style.color = `hsl(${randomHue}, 85%, 75%)`;
          }, index * 120);
          activeStaggerTimeouts.push(timeoutId);
        });
      });
      logoLink.addEventListener('mouseleave', resetLogoLetters);
    }

    let selectedFiles = [];

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const btnMerge = document.getElementById('btnMerge');
    const statusMsg = document.getElementById('statusMsg');

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = 'var(--accent-mid)'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = 'var(--surface-3)'; });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = 'var(--surface-3)';
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    function handleFiles(files) {
      for (let i = 0; i < files.length; i++) {
        if (files[i].type === 'application/pdf') {
          selectedFiles.push(files[i]);
        }
      }
      updateUI();
    }

    function updateUI() {
      fileList.innerHTML = '';
      
      selectedFiles.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `
          <div class="file-meta">
            <span class="file-name">${file.name}</span>
            <span class="file-size">(${(file.size / 1024).toFixed(1)} KB)</span>
          </div>
          <div class="item-controls">
            <button class="control-btn" onclick="moveUp(${index})" title="Move Up">↑</button>
            <button class="control-btn" onclick="moveDown(${index})" title="Move Down">↓</button>
            <button class="control-btn" style="color: #a33b3b;" onclick="removeFile(${index})" title="Remove File">✕</button>
          </div>
        `;
        fileList.appendChild(item);
      });

      btnMerge.disabled = selectedFiles.length < 2;
    }

    window.moveUp = function(index) {
      if (index === 0) return;
      const temp = selectedFiles[index];
      selectedFiles[index] = selectedFiles[index - 1];
      selectedFiles[index - 1] = temp;
      updateUI();
    }

    window.moveDown = function(index) {
      if (index === selectedFiles.length - 1) return;
      const temp = selectedFiles[index];
      selectedFiles[index] = selectedFiles[index + 1];
      selectedFiles[index + 1] = temp;
      updateUI();
    }

    window.removeFile = function(index) {
      selectedFiles.splice(index, 1);
      updateUI();
    }

    btnMerge.addEventListener('click', async () => {
      if (selectedFiles.length < 2) return;
      
      statusMsg.innerText = 'Merging documents... Please wait.';
      statusMsg.className = 'status-msg ink-2';
      btnMerge.disabled = true;

      try {
        const mergedPdf = await PDFLib.PDFDocument.create();
        
        for (const file of selectedFiles) {
          const fileArrayBuffer = await file.arrayBuffer();
          const pdfDoc = await PDFLib.PDFDocument.load(fileArrayBuffer);
          const copiedPages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
          copiedPages.forEach((page) => mergedPdf.addPage(page));
        }
        
        const mergedPdfBytes = await mergedPdf.save();
        
        const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'DocuCraft_Merged.pdf';
        link.click();
        incrementActionStats();
        
        statusMsg.innerText = 'PDF files merged successfully!';
        statusMsg.className = 'status-msg status-success';
      } catch (error) {
        console.error(error);
        statusMsg.innerText = 'An error occurred while merging your PDFs. Ensure files are not corrupted or encrypted.';
        statusMsg.className = 'status-msg status-error';
      } finally {
        btnMerge.disabled = false;
      }
    });
    initializeLogoHoverEngine();
  </script>
</body>
</html>
